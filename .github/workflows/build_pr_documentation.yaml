name: Build PR Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "kernels/**"
      - ".github/workflows/build_pr_documentation.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_pr_documentation.yml@17ccdf17e0f5e5f88b1ce9f20b3b73fb19017169 # main
    with:
      commit_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.number }}
      package_path: kernels/kernels/
      package: kernels
      version_tag_suffix: "kernels/src/"
