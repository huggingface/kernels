name: "Build and test kernel (macOS)"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened] # trigger on PRs
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    name: Build kernel
    runs-on: macos-26
    steps:
      - name: "Select Xcode"
        run: sudo xcrun xcode-select -s /Applications/Xcode_26.0.app
      - name: "Install Metal Toolchain"
        run: xcodebuild -downloadComponent metalToolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: huggingface
          #authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build all Metal example kernels
        run: nix build -L ./examples/kernels#ci-build-metal
      - name: Copy kernel artifacts
        run: cp -rL result/* .

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-kernels-metal
          path: |
            bfl-mlx-kernel
            bfl-torch-kernel
            relu-kernel
            relu-metal-cpp-kernel
            relu-mlx-kernel
          retention-days: 1
          if-no-files-found: error

  test:
    permissions:
      contents: read
    name: Test Metal kernels
    needs: build
    runs-on:
      group: hfc-mac-mini-m1-16
    timeout-minutes: 60
    env:
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download kernel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-kernels-metal
          path: .

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Install test dependencies and kernels from source
        # Keep Torch aligned with torchVersion in examples/kernels/flake.nix
        # and MLX with nix-builder/pkgs/python-modules/mlx-bin.
        run: |
          uv venv
          uv pip install "torch==2.13.0" "mlx==0.32.4" numpy pytest ./kernels

      - name: Run Metal tests
        env:
          LOCAL_KERNELS: kernels-test/relu=relu-kernel:kernels-test/relu-metal-cpp=relu-metal-cpp-kernel:kernels-test/relu-mlx=relu-mlx-kernel:kernels-test/bfl-mlx=bfl-mlx-kernel:kernels-test/bfl-torch=bfl-torch-kernel
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
        run: |
          .venv/bin/python - <<'PY'
          import mlx.core as mx
          import torch

          if not torch.backends.mps.is_available():
              raise SystemExit("Metal tests require an available MPS device.")
          if not mx.metal.is_available():
              raise SystemExit("Metal tests require MLX with Metal support.")
          PY

          # Run separately because the suites contain test modules with the same name.
          .venv/bin/python -m pytest -v -m kernels_ci examples/kernels/relu/tests
          .venv/bin/python -m pytest -v -m kernels_ci examples/kernels/relu-metal-cpp/tests
          .venv/bin/python -m pytest -v -m kernels_ci examples/kernels/relu-mlx/tests
          .venv/bin/python -m pytest -v -m kernels_ci examples/kernels/bfl-mlx/tests
          .venv/bin/python -m pytest -v -m kernels_ci examples/kernels/bfl-torch/tests
