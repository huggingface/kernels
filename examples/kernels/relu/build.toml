[general]
name = "relu"
version = 1
edition = 6
license = "Apache-2.0"
backends = [
    "cpu",
    "cuda",
    "metal",
    "rocm",
    "xpu",
]

[general.hub]
repo-id = "kernels-test/relu"

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[kernel.relu_xpu]
language = "cpp-xpu"
depends = ["torch"]
src = ["relu_xpu/relu.cpp"]

[kernel.relu_metal]
language = "cpp-metal"
depends = ["torch"]
src = [
    "relu_metal/relu.mm",
    "relu_metal/relu.metal",
    "relu_metal/common.h",
]

[kernel.relu_rocm]
language = "cpp-rocm"
depends = ["torch"]
src = ["relu_cuda/relu.cu"]

[kernel.relu_cpu]
language = "cpp-cpu"
depends = ["torch"]
src = ["relu_cpu/relu_cpu.cpp"]

[kernel.relu]
language = "cpp-cuda"
depends = ["torch"]
src = ["relu_cuda/relu.cu"]
