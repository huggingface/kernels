[package]
name = "kernels-python"
version = "0.17.0-dev1"
edition = "2024"
description = "Kernels data structures (Python bindings)"
homepage = "https://github.com/huggingface/kernels"
license = "Apache-2.0"
repository = "https://github.com/huggingface/kernels"

[lib]
name = "_rust"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3", "abi3-py38"] }
serde_json = "1"

[dependencies.kernels-common]
path = "../kernels-common"
version = "0.17.0-dev1"
