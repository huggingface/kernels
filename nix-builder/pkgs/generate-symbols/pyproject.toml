[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "generate-symbols"
version = "0.1.0"
description = "Generate public API symbols for built kernels"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["kernels"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
generate-symbols = "generate_symbols:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["generate_symbols"]

[tool.pytest.ini_options]
testpaths = ["tests"]
