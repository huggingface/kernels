[package]
name = "relu-rust-cuda"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "relu_rust_cuda"

[workspace]

# The kernel and its host code live in this crate. Kernel-builder compiles it
# with the cuda-oxide codegen backend and links the kernels as SASS.
[dependencies]
cuda-core = { git = "https://github.com/drbh/cuda-oxide.git", rev = "d9d4e379e9a80d1ce7c681d88a086aacec95ba23" }
cuda-device = { git = "https://github.com/drbh/cuda-oxide.git", rev = "d9d4e379e9a80d1ce7c681d88a086aacec95ba23" }
cuda-host = { git = "https://github.com/drbh/cuda-oxide.git", rev = "d9d4e379e9a80d1ce7c681d88a086aacec95ba23" }
tvm-ffi = "=0.1.14-post1"
# TODO: a git dependency on huggingface/kernels once the crate is pushed; the
# Nix build only sees this directory.
kernels-cuda = { path = "../../../kernels-cuda" }

# Checked-in bindings: the build needs no CUDA headers or libclang.
[patch."https://github.com/drbh/cuda-oxide.git"]
cuda-bindings = { git = "https://github.com/drbh/cuda-bindings-prebuilt.git", rev = "f129e807d9a8ea32e7572369e91689c00c52570f" }
