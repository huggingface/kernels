  # Check that the built wheels work on the targeted interpreters. This catches
  # wheels that are mistagged or don't load. We cannot test all wheels, since
  # for some wheels we don't have corresponding runners. However, it covers the
  # most popular platforms. The loading is restricted to the Rust module, since
  # this check is only to verify that the compiled Rust module works with the
  # interpreter.
  smoke-test:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs:
      - linux
      - windows
      - macos
    runs-on: ${{ matrix.os }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `expect_tag` is a substring that must occurr in the installed
        # wheel's tag in the metadata.
        include:
          - python: "3.10"
            free_threaded: false
            expect_tag: cp310-abi3-
          - python: "3.14"
            free_threaded: false
            expect_tag: cp310-abi3-
          - python: "3.14t"
            free_threaded: true
            expect_tag: cp314-cp314t-
          - python: "3.15"
            free_threaded: false
            expect_tag: ""
          - python: "3.15t"
            free_threaded: true
            expect_tag: cp315-abi3t-
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Install wheel
        shell: bash
        # Install `kernels` itself strictly from `dist` (no index, and
        # `--only-binary` to never fall back to building the sdist), so that a
        # missing or mis-tagged wheel cannot be masked. Then install its
        # dependencies from the index, since importing `kernels` needs them.
        run: |
          python -m pip install --upgrade pip
          python -m pip --version
          python -m pip install --pre --no-deps --no-index --only-binary :all: --find-links dist kernels
          python - <<'EOF' > requirements.txt
          import importlib.metadata

          for req in importlib.metadata.requires("kernels") or []:
              if "extra ==" not in req:
                  print(req)
          EOF
          cat requirements.txt
          python -m pip install -r requirements.txt
      - name: Check wheel tag and import extension
        shell: bash
        env:
          EXPECT_TAG: ${{ matrix.expect_tag }}
          FREE_THREADED: ${{ matrix.free_threaded }}
        run: |
          python - <<'EOF'
          import importlib.metadata
          import os
          import sys

          wheel = importlib.metadata.distribution("kernels").read_text("WHEEL")
          print(wheel)
          expect = os.environ["EXPECT_TAG"]
          if expect:
              tags = [l for l in wheel.splitlines() if l.startswith("Tag:")]
              assert any(expect in t for t in tags), f"expected {expect!r} in {tags}"

          from kernels import _rust

          print(_rust.__file__)
          assert str(_rust.Backend.from_str("cuda")) == "cuda"
          assert str(_rust.KernelName("relu")) == "relu"

          # Importing the extension must not re-enable the GIL on
          # free-threaded builds.
          gil_enabled = getattr(sys, "_is_gil_enabled", lambda: True)()
          free_threaded = os.environ["FREE_THREADED"] == "true"
          assert gil_enabled is not free_threaded, f"GIL enabled: {gil_enabled}"
          EOF

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/') # only publish to PyPI on tag pushes
    needs:
      - linux
      - musllinux
      - windows
      - macos
      - sdist
      - smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kernels
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --notes ""
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          "$GITHUB_REF_NAME" dist/**
          --repo "$GITHUB_REPOSITORY"

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    if: github.event_name != 'pull_request'
    needs:
      - linux
      - musllinux
      - windows
      - macos
      - sdist
      - smoke-test
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/kernels

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # Only upload when the version is unique.
