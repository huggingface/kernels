name: "Build and test kernel (macOS)"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened] # trigger on PRs
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel
    runs-on: macos-26
    steps:
      - name: "Select Xcode"
        run: sudo xcrun xcode-select -s /Applications/Xcode_26.0.app
      - name: "Install Metal Toolchain"
        run: xcodebuild -downloadComponent metalToolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: huggingface
          #authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # For now we only test that there are no regressions in building macOS
      # kernels. Also run tests once we have a macOS runner.
      - name: Build all Metal example kernels
        run: nix build -L ./examples/kernels#ci-build-metal
