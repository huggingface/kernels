[package]
name = "kernel-port"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
kdl = "6.5"
libcst = { version = "1.8.6", default-features = false }
self_cell = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
similar = "3.2.0"

# Clippy runs at pedantic, plus two nursery lints worth the churn.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
use_self = "warn"
needless_pass_by_ref_mut = "warn"

# The manifest is a String built by appending. write! plus an unwrap on a write
# that cannot fail would read worse than push_str(&format!(..)).
format_push_string = "allow"

# This is a workspace-internal tool, not a published library: its callers do not
# match on error variants, and every accessor returns the value that is the
# point of calling it.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# The CLI flags are bools because they are flags.
struct_excessive_bools = "allow"
