name: "Nix checks"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened] # trigger on PRs
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    name: Nix checks
    runs-on:
      group: aws-highmemory-32-plus-nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            max-jobs = 4
            cores = 12
            sandbox-fallback = false
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: huggingface
        env:
          USER: runner
      - name: Check formatting
        run: nix fmt -- --ci
      - name: Nix checks
        run: nix build .\#checks.x86_64-linux.default
      - name: Test kernel card generation
        run: |
          (
            cd examples/kernels/silu-and-mul
            nix build -L .
            test -e result/CARD.md
          )
